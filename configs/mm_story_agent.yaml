speech_generation:
    tool: ${tts_tool:-gtts}  # Default to gtts if not specified
    cfg:
        sample_rate: *sample_rate
    params:
        lang: "en"

image_generation:
    tool: story_diffusion_t2i
    cfg:
        device: "cpu"
        num_turns: 3
        llm: "openai"
        model: "dall-e-3"  # Specify DALL-E model
        height: 1024
        width: 1024
    params:
        style_name: "Storybook"
        quality: "standard"  # or "hd" for higher quality

music_generation:
    tool: musicgen_t2m
    cfg:
        device: "cpu"
        llm_type: "gemini"
        num_turns: 3
        model_name: "facebook/musicgen-small"  # Using smaller model for low memory
    params:
        duration: 30

video_compose:
    tool: slideshow_video_compose
    cfg:
        {}
    params:
        height: *image_height
        width: *image_width
        story_dir: *story_dir
        fps: 8
        audio_sample_rate: *sample_rate
        audio_codec: mp3
        caption:
            font: resources/font/msyh.ttf
            # bg_color: LightGrey
            fontsize: 32
            color: white
            # stroke_color: white
            # stroke_width: 0.5
            max_length: 50
        slideshow_effect:
            bg_speech_ratio: 0.6
            sound_volume: 0.5
            music_volume: 0.3
            fade_duration: 0.1
            slide_duration: 0.1
            zoom_speed: 0.5
            move_ratio: 0.9

video_composition:
    tool: slideshow_video_compose
    cfg:
        fps: 10
        audio_sample_rate: *sample_rate
        audio_codec: "mp3"
        fade_duration: 0.1
        slide_duration: 0.1
        zoom_speed: 0.5
        move_ratio: 0.95
        sound_volume: 0.2
        music_volume: 0.15
        bg_speech_ratio: 0.4
        caption_config:
            area_height: 100
            max_length: 100
            fontsize: 24
            color: 'white'
            font: 'Arial'
    params: {}

# Add these settings for lower resource usage
system:
    low_memory_mode: true
    batch_size: 1
    max_parallel_processes: 1
    