# Define common variables at the top
sample_rate: &sample_rate 16000
image_height: &image_height 512
image_width: &image_width 512

story_dir: &story_dir generated_stories/example

story_writer:
    tool: qa_outline_story_writer
    cfg:
        max_conv_turns: 3
        num_outline: 4
        temperature: 0.5
        llm: "openai"
        model_name: "gpt-4.1-2025-04-14"
    params:
        story_topic: "Two clever crows outwit a deadly cobra with the help of a jackal"
        main_role: "The wise jackal"
        scene: "The cobra rises from the hollow, only to be beaten by palace guards retrieving the stolen necklace"
        video_style: "youtube shorts"
        base_story: |-
                Once upon a time, two crows—a husband and wife—lived in a nest on a big banyan tree. But they had a terrifying neighbor: a black cobra that lived in the hollow of the same tree.

                Every time the crows laid eggs, the cobra slithered up and ate their chicks. Helpless and heartbroken, the crows sought advice from a wise jackal living nearby.

                "O Friend," they said, "this cobra is destroying our family. How can we protect our young?"

                The jackal replied, "Even the most dangerous enemies can be defeated with cleverness. Here's what you must do..."

                He told them to fly into the royal capital, find something valuable lying around, and snatch it while the servants were watching. Then they should drop the item into the cobra's hollow. The humans, eager to retrieve the item, would handle the cobra themselves.

                The crows followed the plan. At the palace lake, they saw royal women swimming, their gold necklaces left by the shore. The female crow swooped down and grabbed one. Flying slowly, she lured the palace guards to the banyan tree.

                She dropped the necklace right at the cobra's hollow and perched nearby to make sure the humans saw.

                The cobra slithered out, alarmed by the noise—only to be beaten by guards retrieving the stolen jewelry.

                The wicked cobra was killed, and the crows lived peacefully ever after with their chicks—safe at last.

                **The lesson: even a deadly enemy can be defeated with smart thinking and teamwork.**



  
